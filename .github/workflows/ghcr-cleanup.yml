name: GHCR Retention Cleanup

on:
  schedule:
    - cron: "0 4 * * 0"   # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    name: Trim GHCR image tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Release tags (X.Y.Z) and latest are never deleted; :<sha> and nightly
      # :<version>-<date> rebuild tags are trimmed to the newest 5
      - name: Keep last 5 tagged versions, delete untagged
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: race-crew-network
          owner: chris-edwards-pub
          keep-n-tagged: 5
          delete-untagged: true
          use-regex: true
          exclude-tags: ^(latest|\d+\.\d+\.\d+)$
