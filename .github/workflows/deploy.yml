name: Deploy to Lightsail

on:
  push:
    branches: [master]

  # Weekly rebuild to pick up patched Debian packages (apt-get upgrade runs on
  # every build). Runs before the 06:00 UTC daily scan so it scans a fresh image.
  schedule:
    - cron: "0 4 * * 1"   # Mondays at 4 AM UTC

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (defaults to master)"
        required: false
        default: "master"
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: chris-edwards-pub/race-crew-network

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' app/__init__.py)
          IMAGE="$REGISTRY/$IMAGE_NAME"
          echo "Detected version: $VERSION"
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$GITHUB_SHA"
            echo "$IMAGE:$VERSION-$(date -u +%Y%m%d)"
            # The plain version tag is immutable: only push it on the first
            # build of a version so it always points at the original release.
            if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
              echo "::notice::$IMAGE:$VERSION already exists; leaving it unchanged" >&2
            else
              echo "$IMAGE:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  scan-image:
    name: Scan Image for Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-and-push
    permissions:
      contents: read
      security-events: write

    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          output: trivy-results.txt

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-vulnerability-report
          path: trivy-results.txt
          retention-days: 30

      - name: Write Trivy results to job summary
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            echo "## 🔍 Trivy Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔍 Trivy Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ trivy-results.txt was not found — the scan may not have produced output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Trivy for SARIF output
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: scan-image

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Wait for any in-progress Lightsail deployment
        run: |
          SERVICE="${{ vars.CONTAINER_SERVICE_NAME }}"
          for i in $(seq 1 60); do
            STATE=$(aws lightsail get-container-service-deployments \
              --service-name "$SERVICE" \
              --query 'deployments[0].state' --output text 2>/dev/null || echo "")
            echo "Latest Lightsail deployment state: ${STATE:-unknown} (attempt $i/60)"
            if [ "$STATE" != "ACTIVATING" ]; then
              echo "No deployment in progress — ready to deploy."
              break
            fi
            sleep 15
          done

      - name: Deploy to Lightsail Container Service
        run: |
          aws lightsail create-container-service-deployment \
            --service-name ${{ vars.CONTAINER_SERVICE_NAME }} \
            --containers '{
              "web": {
                "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",
                "ports": {"8000": "HTTP"},
                "environment": {
                  "DATABASE_URL": "mysql+pymysql://${{ vars.MYSQL_USER }}:${{ secrets.MYSQL_PASSWORD }}@${{ vars.DB_ENDPOINT }}/${{ vars.MYSQL_DATABASE }}",
                  "SECRET_KEY": "${{ secrets.SECRET_KEY }}",
                  "UPLOAD_FOLDER": "/app/uploads",
                  "BUCKET_NAME": "${{ vars.BUCKET_NAME }}",
                  "AWS_ACCESS_KEY_ID": "${{ secrets.BUCKET_ACCESS_KEY_ID }}",
                  "AWS_SECRET_ACCESS_KEY": "${{ secrets.BUCKET_SECRET_ACCESS_KEY }}",
                  "AWS_REGION": "us-east-1",
                  "INIT_ADMIN_EMAIL": "${{ secrets.INIT_ADMIN_EMAIL }}",
                  "INIT_ADMIN_PASSWORD": "${{ secrets.INIT_ADMIN_PASSWORD }}",
                  "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}",
                  "SES_ACCESS_KEY_ID": "${{ secrets.SES_ACCESS_KEY_ID }}",
                  "SES_SECRET_ACCESS_KEY": "${{ secrets.SES_SECRET_ACCESS_KEY }}"
                }
              }
            }' \
            --public-endpoint '{
              "containerName": "web",
              "containerPort": 8000,
              "healthCheck": {
                "path": "/",
                "successCodes": "200-499",
                "intervalSeconds": 30,
                "timeoutSeconds": 5
              }
            }'
