name: Deploy to Lightsail

on:
  push:
    branches: [master]
    # Changelog-only commits (e.g. from the nightly security rebuild) don't
    # need a new image
    paths-ignore: [VERSIONS.md]

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy (defaults to master)"
        required: false
        default: "master"
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: chris-edwards-pub/race-crew-network

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VERSION=$(grep -oP '(?<=__version__ = ")[^"]+' app/__init__.py)
          IMAGE="$REGISTRY/$IMAGE_NAME"
          echo "Detected version: $VERSION"
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:$GITHUB_SHA"
            # The plain version tag is immutable: only push it on the first
            # build of a version so it always points at the original release.
            if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
              echo "::notice::$IMAGE:$VERSION already exists; leaving it unchanged" >&2
            else
              echo "$IMAGE:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  scan-image:
    name: Scan Image for Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-and-push
    permissions:
      contents: read
      security-events: write

    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          output: trivy-results.txt

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-vulnerability-report
          path: trivy-results.txt
          retention-days: 30

      - name: Write Trivy results to job summary
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            echo "## 🔍 Trivy Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-results.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔍 Trivy Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ trivy-results.txt was not found — the scan may not have produced output." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Trivy for SARIF output
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  deploy:
    name: Deploy
    needs: scan-image
    uses: ./.github/workflows/lightsail-deploy.yml
    with:
      image: ghcr.io/chris-edwards-pub/race-crew-network:${{ github.sha }}
    secrets: inherit
